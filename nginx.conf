server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # All routes served by the React SPA (HashRouter — index.html handles /#/*)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (JS/CSS have content-hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache index.html or JSON data files
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json;
    gzip_min_length 256;
}
